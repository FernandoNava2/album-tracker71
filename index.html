<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albums</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="col-12 col-md-2 text-center">
<form id="album-form">
  <fieldset>
    <legend>ALBUMS</legend>
    <div class="mb-3">
      <label for="disabledTextInput" class="form-label">Titulo</label>
      <input type="text" name="album" id="disabledTextInput" class="form-control text-center" placeholder="Añade el titulo">
    </div>
    <div class="mb-3">
      <label for="disabledTextInput" class="form-label">Artista</label>
      <input type="text" id="disabledTextInput" class="form-control text-center" name="artista" placeholder="Añade el artista">
    </div>
    <div class="mb-3">
      <label for="disabledTextInput" class="form-label">Año de lazamiento</label>
      <input type="text" id="disabledTextInput" class="form-control text-center" name="Año de lanzamiento" placeholder="Añade el año">
    </div>
    <div class="mb-3">
      <label for="disabledTextInput" class="form-label">Genero</label>
      <input type="text" id="disabledTextInput" name="Genero" class="form-control text-center" placeholder="Añade el Genero">
    </div>
    <div class="mb-3">
      <label for="disabledTextInput" class="form-label">Raiting</label>
      <input type="text" name="Raiting" id="disabledTextInput" class="form-control text-center" placeholder="Añade el Raiting">
    </div>
    

        <div class="mb-3">
      <div class="form-check">
        <input class="form-check-input" name="Listened" type="checkbox" id="disabledFieldsetCheck">
        <label class="form-check-label" for="disabledFieldsetCheck">
          ¿Ya lo has escuchado?
        </label>
      </div>
    </div>
    
    <button type="submit" class="btn btn-primary" type="submit">Listo</button>
  </fieldset>
</form>
</div>
<main id="album-container">
    texto del elemento contenedor
    <p>hola dentro de un p</p>
</main>

    <script src="app.js"></script>
</body>
</html>
